name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install training dependencies
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements/train.txt

      - name: Install pytest
        run: pip install pytest

      - name: Run tests
        run: pytest tests/test_model.py -v